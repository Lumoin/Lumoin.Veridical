name: Lumoin.Veridical slow proof gates

# The multi-minute end-to-end proof gates ([TestCategory("Slow")]: full-width Ligero
# proves, the GKR SHA-256 preimage capstones, the cross-field MAC pair, the real-mdoc
# capstones) are excluded from the regular build's test step to keep every-push CI
# fast. The whole category completes in roughly half an hour on a hosted runner, so
# it runs on a weekly schedule like the fuzz job, and stays manually dispatchable —
# dispatch it before a release or after changes to the provers/verifiers whenever
# the last scheduled result is stale.

on:
  workflow_dispatch:
  schedule:
    # Weekly run of the Slow proof gates on the default branch. Staggered after
    # the nightly build (02:00 UTC) and the Monday fuzz job (03:00 UTC).
    - cron: "0 4 * * 1"   # 04:00 UTC every Monday.

env:
  DOTNET_ENVIRONMENT: CI
  BUILD_CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  VERIDICAL_TESTS: Lumoin.Veridical.Tests

  # The same egress allow-list as the main build: SDK installation, NuGet
  # restore, and the standard api.github.com surface.
  COMMON_ALLOWED_ENDPOINTS: >
    aka.ms:443
    api.github.com:443
    *.actions.githubusercontent.com:443
    api.nuget.org:443
    www.nuget.org:443
    builds.dotnet.microsoft.com:443
    ci.dot.net:443
    pkgs.dev.azure.com:443
    github.com:443
    nuget.pkg.github.com:443

jobs:
  slow-tests:
    name: Run the slow proof gates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
      with:
        disable-sudo: true
        egress-policy: block
        allowed-endpoints: ${{ env.COMMON_ALLOWED_ENDPOINTS }}

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        cache: true
        cache-dependency-path: '**/packages.lock.json'
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --tl --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      timeout-minutes: 15

    # The Slow category only; the regular build already runs everything else on
    # every push. The timeout is about triple the measured hosted-runner duration
    # of the full category, so a wedged run fails long before it burns a weekly
    # slot's worth of minutes.
    - name: Run the slow proof gates
      run: '${{ github.workspace }}/test/${{ env.VERIDICAL_TESTS }}/bin/${{ env.BUILD_CONFIGURATION }}/net10.0/${{ env.VERIDICAL_TESTS }} --filter "TestCategory=Slow"'
      timeout-minutes: 120
